<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Partner enquiry (embedded form)</title>
<style>
  body { margin: 0; padding: 16px; font: 15px/1.5 system-ui, sans-serif; color: #18181b; background: #f8fafc; }
  label { display: block; margin: 10px 0; font-weight: 500; }
  input, select { display: block; width: 100%; margin-top: 4px; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; box-sizing: border-box; }
  button { margin-top: 8px; padding: 9px 16px; border: 0; border-radius: 6px; background: #4f46e5; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  .brand { font-size: 12px; color: #64748b; }
</style>
</head>
<body>
<!-- Stands in for a third-party form (HubSpot, Typeform…). No GTM here, like a real third-party embed. -->
<p class="brand">Embedded form · “FormVendor” (fake)</p>
<form id="partner-form">
  <label>Company <input name="company" required autocomplete="off"></label>
  <label>Partnership type <select name="type" required><option value="">Choose…</option><option>Reseller</option><option>Agency</option></select></label>
  <button>Send enquiry</button>
</form>
<p id="sent" hidden>Sent (not really).</p>
<script>
  document.getElementById("partner-form").addEventListener("submit", function (e) {
    e.preventDefault();
    // Tell the parent page, which can push it to its own dataLayer. Only the form name is shared.
    window.parent.postMessage({ type: "demo_iframe_form", form_name: "partner_enquiry", status: "submitted" }, location.origin);
    e.target.hidden = true;
    document.getElementById("sent").hidden = false;
  });
</script>
</body>
</html>
