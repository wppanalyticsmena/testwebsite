<main>
<h1>Contact us</h1>
<div class="two-col">
<div>
<form id="contact-form" class="form" data-form-name="contact">
<p class="note">Test site: use a made-up email.</p>
<label>Enquiry type <select name="enquiry" required><option value="">Choose…</option><option value="sales">Sales</option>
<option value="support">Support</option><option value="partnership">Partnership</option></select></label>
<label>Name <input required name="name" autocomplete="off"></label>
<label>Email <input required type="email" name="email" autocomplete="off"></label>

<label>Message <textarea name="message" rows="4"></textarea></label>

</form>
